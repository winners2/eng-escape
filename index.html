<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꿈 도둑 미스터 노바디의 비밀 · 영어 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#0e1630; --panel:#17224a; --panel2:#1f2d5e; --line:#34467f;
  --lamp:#f6b93b; --lamp-d:#b8860f; --teal:#37c6b3; --rose:#ef6f6c;
  --text:#eef2fb; --muted:#a9b6d8; --paper:#efe5cc; --paper-ink:#3b2f1b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{
  margin:0;min-height:100vh;color:var(--text);color-scheme:dark;
  background:radial-gradient(900px 420px at 50% -120px,#2c418a 0%,transparent 70%),var(--ink);
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:18px;line-height:1.55;
}
h1,h2,h3,button,select,.jua{font-family:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400}
h1,h2,h3{margin:0}
.wrap{position:relative;z-index:2;max-width:860px;margin:0 auto;padding:18px 16px 70px}
:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px;background:#0a1128f2;border-bottom:2px solid var(--line)}
.brand{font-family:'Jua',sans-serif;font-size:18px;color:var(--lamp)}
.slots{display:flex;gap:6px}
.slot{width:32px;height:40px;display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:20px;color:#5c6a97;background:#0a1128;border:3px solid #6b4d0c;border-radius:3px;box-shadow:inset 0 0 0 2px #0a1128}
.slot.on{color:var(--lamp);border-color:var(--lamp);background:#2a2208;box-shadow:inset 0 0 0 2px #0a1128,0 0 12px #f6b93b77}
.score{font-family:'Jua',sans-serif;font-size:19px}

/* buttons */
.btn{border:0;border-radius:999px;padding:12px 24px;font-size:20px;cursor:pointer;background:var(--lamp);color:#1b1402;transition:transform .12s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.small{font-size:16px;padding:8px 16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.teal{background:var(--teal);color:#05211d}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center;justify-content:center}

/* title */
.beam{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle 220px at var(--mx,50%) var(--my,40%),#f6b93b2e,transparent 72%)}
.title-screen{position:relative;z-index:1;min-height:78vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:18px}
.title-screen h1{font-size:clamp(40px,9vw,76px);line-height:1.08;letter-spacing:-.5px}
.title-screen .sub{color:var(--muted);font-size:20px;max-width:34ch}
.tiny{font-size:15px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;cursor:pointer;padding:6px 0}

/* panels */
.panel{background:rgba(23,34,74,.93);border:2px solid var(--line);border-radius:22px;padding:22px}
.note{background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:20px 22px;transform:rotate(-.6deg);box-shadow:0 7px 0 #00000045;font-size:20px}
.note .en{font-family:'Jua',sans-serif;font-size:24px;display:block;margin-top:8px}
.story{color:var(--muted);margin:14px 4px 18px}
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.crumb .room{font-family:'Jua',sans-serif;font-size:22px}
.dots{display:flex;gap:6px;margin-left:auto}
.dot{width:12px;height:12px;border-radius:50%;background:#2a3a73;display:block}
.dot.now{background:var(--lamp)} .dot.done{background:var(--teal)}
.mission h2{font-size:28px;margin-bottom:6px}
.lead{margin:0 0 16px;color:var(--muted)}
.tools{margin-top:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hintbox{background:#10312f;border-left:5px solid var(--teal);padding:10px 14px;border-radius:4px 12px 12px 4px}
.fb{min-height:30px;margin:10px 0;font-size:19px}
.fb.good{color:var(--teal)} .fb.bad{color:var(--rose)}

/* map */
.map h2{font-size:30px;margin:6px 0 4px}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:16px}
.room-tile{position:relative;text-align:left;padding:16px 16px 16px 18px;min-height:112px;background:rgba(23,34,74,.92);border:2px solid var(--line);border-radius:6px 22px 6px 22px;color:var(--text);cursor:pointer}
.room-tile .ic{font-size:34px;display:block}
.room-tile .nm{font-size:21px;display:block;margin-top:2px}
.room-tile .st{font-size:15px;color:var(--muted)}
.room-tile.open{border-color:var(--lamp);box-shadow:0 0 0 3px #f6b93b33}
.room-tile.done{border-color:var(--teal)}
.room-tile.lock{opacity:.5;cursor:not-allowed}
.room-tile.exit{grid-column:1/-1;border-radius:22px 22px 6px 6px;text-align:center}

/* match */
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.col{display:flex;flex-direction:column;gap:12px}
.card{cursor:pointer;color:var(--text);transition:transform .12s,background .2s}
.card.pic{font-size:44px;min-height:92px;line-height:1.1;background:#0a1128;border:5px solid var(--lamp-d);border-radius:3px;box-shadow:inset 0 0 0 3px #0a1128,inset 0 0 0 5px #6b4d0c}
.card.word{font-size:21px;min-height:92px;background:var(--panel2);border:2px solid var(--line);border-top:6px solid var(--lamp);border-radius:8px}
.card.sel{outline:4px solid var(--lamp);outline-offset:2px;transform:scale(1.03)}
.card.ok{border-color:var(--teal)!important;background:#12413f;pointer-events:none}
.card.ok.pic{box-shadow:inset 0 0 0 3px #12413f,inset 0 0 0 5px #1f7d70}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{min-height:96px;border-radius:10px;border:3px solid var(--line);background:var(--panel2);color:var(--text);font-size:22px;cursor:pointer;padding:6px}
.mcard.back{font-size:34px;background:repeating-linear-gradient(45deg,#1f2d5e,#1f2d5e 8px,#25366f 8px,#25366f 16px)}
.mcard.pic{font-size:40px;background:#0a1128;border-color:var(--lamp-d)}
.mcard.found{border-color:var(--teal);background:#12413f;pointer-events:none}

/* order & spell */
.stack{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;align-items:center;min-height:56px;padding:10px 14px;border-radius:6px 16px 6px 16px;font-size:20px;text-align:left}
.line.slotline{background:#0a1128;border:2px dashed var(--line);color:var(--muted)}
.line.slotline.filled{background:var(--paper);color:var(--paper-ink);border:2px solid var(--paper);cursor:pointer;font-family:'Jua',sans-serif}
.line.piece{background:var(--panel2);border:2px solid var(--line);color:var(--text);cursor:pointer;font-family:'Jua',sans-serif}
.line.piece:disabled{opacity:.3}
.line .n{font-family:'Jua',sans-serif;color:var(--lamp);min-width:22px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.tile{position:relative;width:54px;height:62px;font-size:28px;border-radius:8px;border:2px solid var(--line);border-bottom:6px solid #0a1128;background:var(--panel2);color:var(--text);cursor:pointer}
.tile:disabled{opacity:.25}
.tile small{position:absolute;top:2px;right:5px;font-size:12px;color:var(--lamp);font-family:'Gowun Dodum',sans-serif}
.answer{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.ans{width:46px;height:56px;border-bottom:4px solid var(--lamp);display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:30px;color:var(--lamp)}
.picword{font-size:56px;text-align:center;line-height:1.1}
.picword .ko{display:block;font-size:20px;color:var(--muted);margin-top:4px}

/* quiz */
.qhead{color:var(--muted);font-size:16px;margin-bottom:6px}
.qtext{font-size:22px;white-space:pre-line;margin-bottom:10px}
.qtext.en{font-family:'Jua',sans-serif;font-size:25px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
.opt{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:10px 14px;font-size:22px;color:var(--text);background:var(--panel2);border:2px solid var(--line);border-radius:14px;cursor:pointer}
.opts.pics .opt{flex-direction:column;gap:2px}
.opt .oe{font-size:38px;line-height:1.1}
.opt.good{background:#12413f;border-color:var(--teal)}
.opt.bad{background:#40202a;border-color:var(--rose);opacity:.6}
.opt:disabled{cursor:default}

/* speak */
.mirror{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.shadowman{font-size:70px;width:110px;height:140px;display:grid;place-items:center;border:5px solid var(--lamp-d);border-radius:60px 60px 6px 6px;background:#0a1128;box-shadow:inset 0 0 30px #2c418a}
.bubble{flex:1;min-width:220px;background:var(--paper);color:var(--paper-ink);padding:16px 20px;border-radius:20px 20px 20px 4px}
.bubble .big{font-family:'Jua',sans-serif;font-size:27px;line-height:1.3}
.bubble .bk{font-size:16px;opacity:.8}
.bubble.ok{background:#bff0e6}
.micbtn.live{animation:pulse 1s infinite;background:var(--rose);color:#fff}
@keyframes pulse{50%{box-shadow:0 0 0 12px #ef6f6c44}}

/* logic */
.clues{background:var(--paper);color:var(--paper-ink);padding:14px 20px;border-radius:4px;margin-bottom:14px;font-size:20px}
.clues p{margin:2px 0;font-family:'Jua',sans-serif}
.who{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
.who b{font-family:'Jua',sans-serif;font-size:22px;min-width:76px;font-weight:400}
select{font-size:20px;padding:10px 12px;border-radius:10px;background:var(--panel2);color:var(--text);border:2px solid var(--line);min-width:200px}

/* clear / ending */
.clearcard{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.stars{font-size:44px;letter-spacing:6px}
.bigframe{width:120px;height:150px;display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:80px;color:var(--lamp);background:#2a2208;border:7px solid var(--lamp);border-radius:4px;box-shadow:inset 0 0 0 3px #0a1128,0 0 40px #f6b93b99;animation:drop .7s ease-out}
@keyframes drop{from{transform:translateY(-40px) rotate(-6deg);opacity:0}}
.frames{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.frame{width:62px;height:76px;display:grid;place-items:center;font-size:34px;border:5px solid #6b4d0c;border-radius:3px;background:#0a1128;color:transparent}
.frame.lit{animation:lit .6s forwards;color:inherit}
@keyframes lit{to{border-color:var(--lamp);background:#2a2208;box-shadow:0 0 18px #f6b93b99}}
.letters{font-family:'Jua',sans-serif;font-size:34px;letter-spacing:8px;color:var(--lamp)}
.jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:14px 0}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#0a1128;border:2px solid var(--lamp);padding:10px 20px;border-radius:999px;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(max-width:520px){
  body{font-size:17px}
  .pair-grid{gap:10px}
  .card.pic{font-size:38px}
  .opts{grid-template-columns:1fr}
  .opts.pics{grid-template-columns:1fr 1fr}
  .tile{width:46px;height:56px;font-size:24px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* background image layer */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--ink)}
#bg svg{width:100%;height:100%;display:block}
#bg.dim{filter:brightness(.42) blur(3px);transform:scale(1.04)}
#bg.soft{filter:brightness(.62)}
.title-screen h1,.title-screen .sub,.title-screen .tiny{text-shadow:0 2px 14px #000c}
/* room scene */
.scenebox{border:4px solid var(--lamp-d);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px #000a;background:#000;line-height:0}
.scene{width:100%;height:auto;display:block;-webkit-user-select:none;user-select:none}
.scene text{font-family:'Jua','Gowun Dodum',sans-serif}
.scene .hit{fill:transparent}
.scene .hs,.scene .dc,.scene .piece{cursor:pointer;outline:none}
.scene .hs:hover .hit,.scene .hs:focus-visible .hit{fill:rgba(246,185,59,.16)}
.scene .dc:hover .hit,.scene .dc:focus-visible .hit{fill:rgba(255,255,255,.08)}
.scene .ring{stroke-width:4}
.scene .hs.open .ring{stroke:#f6b93b;stroke-dasharray:14 10;animation:march 1.4s linear infinite}
.scene .hs.solved .ring{stroke:#37c6b3;stroke-width:3}
.scene .hs.locked .ring{stroke:#7b86a8;stroke-dasharray:4 8}
.scene .hs.locked{cursor:not-allowed}
@keyframes march{to{stroke-dashoffset:-48}}
.scene .pill rect{fill:#0a1128;stroke:#f6b93b;stroke-width:2.5}
.scene .pill text{fill:#fff;font-size:23px}
.scene .hs.solved .pill rect{stroke:#37c6b3}
.scene .hs.locked .pill rect{stroke:#7b86a8}
.scene .bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--lamp-d);background:rgba(10,17,40,.85);color:var(--text);border-radius:999px;padding:8px 16px;font-size:16px;cursor:pointer}
.chip.solved{border-color:var(--teal)}
.chip.locked{border-color:var(--line);opacity:.7}
.story{background:rgba(10,17,40,.7);border-left:4px solid var(--lamp);padding:10px 14px;border-radius:4px 14px 14px 4px;color:var(--text)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(5,9,22,.82)}
.modal .panel{max-width:440px;width:100%}
.crumb .room{text-shadow:0 2px 10px #000}

.ctrl{display:flex;gap:8px;margin-left:auto;align-items:center}
.ibtn{border:2px solid var(--line);background:#0a1128;color:var(--text);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer;white-space:nowrap}
.ibtn:hover{border-color:var(--lamp)}
.ibtn[aria-pressed="false"]{color:var(--muted)}
/* ---------- walkable room stage ---------- */
.stage{position:relative;width:min(100%,calc((100vh - 210px)*1.6));min-width:300px;aspect-ratio:288/180;margin:10px auto 0;border:4px solid var(--lamp-d);border-radius:12px;overflow:hidden;touch-action:none;background:#000;-webkit-user-select:none;user-select:none;box-shadow:0 12px 40px #000a;animation:fadein .5s}
@keyframes fadein{from{opacity:0}}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.wlabels{position:absolute;inset:0;pointer-events:none}
.wlabel{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);white-space:nowrap;font-family:'Jua','Gowun Dodum',sans-serif;font-size:clamp(9px,1.5vw,15px);line-height:1.3;padding:.15em .7em;border-radius:999px;background:rgba(10,17,40,.93);border:1.5px solid var(--lamp);color:#fff;cursor:pointer}
.wlabel.below{transform:translate(-50%,0)}
.wlabel.decoy{border-color:#7b86a8;color:#d6dcf3}
.wlabel.done{border-color:var(--teal)}
.wlabel.lock{border-color:var(--rose)}
.wlabel.near{outline:3px solid #f6b93b88;outline-offset:1px}
.wbanner{position:absolute;top:6px;left:50%;transform:translateX(-50%);max-width:92%;background:rgba(10,17,40,.9);border:2px solid var(--line);border-radius:999px;padding:.25em 1em;font-size:clamp(9px,1.7vw,16px);transition:opacity .8s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.joy{position:absolute;left:3%;bottom:5%;width:21%;min-width:84px;max-width:124px;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.38);touch-action:none;cursor:grab}
.knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;background:rgba(255,255,255,.6);transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 2px 8px #0008}
.actbtn{position:absolute;right:3%;bottom:6%;border:0;border-radius:999px;padding:.5em 1.1em;font-family:'Jua',sans-serif;font-size:clamp(14px,2.2vw,22px);background:var(--lamp);color:#1b1402;cursor:pointer;box-shadow:0 4px 14px #000a;animation:pulse2 1.1s infinite}
@keyframes pulse2{50%{transform:scale(1.06)}}
.modal.big{align-items:start;overflow:auto;padding:14px}
.mwrap{width:100%;max-width:860px;margin:0 auto}
/* teacher */
.inp{font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel2);color:var(--text);width:100%}
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.trow .inp{flex:1;min-width:140px;width:auto}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0}
.wcard{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.wemo{font-size:32px;line-height:1.1}
.wen{font-family:'Jua',sans-serif;font-size:19px}
.wko{color:var(--muted);font-size:15px;margin-bottom:6px}
.copy{position:relative;z-index:2;text-align:center;font-size:12px;line-height:1.5;color:var(--muted);opacity:.75;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));text-shadow:0 1px 6px #000c}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<header id="hud" class="hud" hidden></header>
<div class="beam" id="beam" hidden></div>
<main class="wrap" id="app"></main>
<footer class="copy">© 2026 nal ssam. 본 자료는 수업 목적으로 제작되었으며, 무단 복제·배포를 금지합니다.</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $app=document.getElementById('app'),$hud=document.getElementById('hud'),$toast=document.getElementById('toast'),$beam=document.getElementById('beam');
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let tt;function toast(m,ms){$toast.textContent=m;$toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$toast.classList.remove('show'),ms||1600);}
function shakeEl(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');}

/* ---------- background music (Web Audio, no external files) ---------- */
const Music=(function(){
  const AC=window.AudioContext||window.webkitAudioContext;
  let ctx=null,out=null,bus=null,wet=null,timer=null,nextT=0,step=0,running=false,enabled=true,duckF=1,holdF=1;
  try{ if(localStorage.getItem('nobody-music')==='off') enabled=false; }catch(e){}
  const BPM=74,SP=60/BPM/2;
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const BARS=[
    {bass:45,chord:[57,60,64],arp:[69,72,76]},
    {bass:41,chord:[53,57,60],arp:[65,69,72]},
    {bass:38,chord:[50,53,57],arp:[62,65,69]},
    {bass:40,chord:[52,56,59],arp:[64,68,71]}
  ];
  const PENTA=[81,84,88,91,93];
  const PAT=[0,1,2,1,0,1,2,1];
  function setLevel(){ if(!out) return; out.gain.setTargetAtTime(enabled?0.5*duckF*holdF:0,ctx.currentTime,0.12); }
  function build(){
    ctx=new AC();
    out=ctx.createGain(); out.gain.value=0; out.connect(ctx.destination);
    bus=ctx.createGain(); bus.connect(out);
    wet=ctx.createGain(); wet.gain.value=0.45;
    const dl=ctx.createDelay(1.0); dl.delayTime.value=0.405;
    const fb=ctx.createGain(); fb.gain.value=0.38;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1800;
    wet.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(lp); lp.connect(bus);
  }
  function tone(f,t,d,type,v,send){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(bus); if(send) g.connect(wet);
    o.start(t); o.stop(t+d+0.05);
  }
  function pad(f,t,d,v){
    const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type='sawtooth'; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=520;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+d*0.35); g.gain.linearRampToValueAtTime(0.0001,t+d);
    o.connect(lp); lp.connect(g); g.connect(bus);
    o.start(t); o.stop(t+d+0.05);
  }
  function sched(s,t){
    const b=BARS[Math.floor(s/8)%4],i=s%8;
    if(i===0){ tone(hz(b.bass),t,SP*7.5,'sine',0.2,false); b.chord.forEach(n=>pad(hz(n),t,SP*8.4,0.035)); }
    tone(hz(b.arp[PAT[i]]),t,SP*1.8,'triangle',0.1,true);
    if(i===5&&Math.random()<0.7) tone(hz(PENTA[Math.floor(Math.random()*PENTA.length)]),t,1.6,'sine',0.07,true);
  }
  function pump(){ while(nextT<ctx.currentTime+0.5){ sched(step,nextT); nextT+=SP; step++; } }
  function start(){
    if(!AC||!enabled) return;
    try{
      if(!ctx) build();
      if(ctx.state==='suspended') ctx.resume();
      if(!running){ running=true; nextT=ctx.currentTime+0.15; timer=setInterval(pump,120); }
      setLevel();
    }catch(e){}
  }
  function pause(){
    running=false; clearInterval(timer);
    if(ctx){ setLevel(); setTimeout(()=>{ if(!running&&ctx&&ctx.state==='running') ctx.suspend(); },500); }
  }
  const label=()=>!AC?'🔇 음악 없음':enabled?'🎵 음악 ON':'🔇 음악 OFF';
  function refresh(){ document.querySelectorAll('.musicbtn').forEach(b=>{ b.textContent=label(); b.setAttribute('aria-pressed',String(enabled)); }); }
  function toggle(){
    enabled=!enabled;
    try{ localStorage.setItem('nobody-music',enabled?'on':'off'); }catch(e){}
    if(enabled) start(); else pause();
    refresh();
  }
  window.addEventListener('pointerdown',()=>{ if(enabled&&!running) start(); });
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) { if(running) pause(); } else if(enabled&&ctx) start(); });
  return {toggle,label,isOn:()=>enabled,duck:b=>{duckF=b?0.3:1;setLevel();},hold:b=>{holdF=b?0:1;setLevel();}};
})();

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){
  return new Promise(resolve=>{
    let got=null,err=null,r,fin=false,timer=0;
    const finish=v=>{ if(fin) return; fin=true; clearTimeout(timer); Music.hold(false); resolve(v); };
    Music.hold(true);
    try{ r=new SR(); }catch(e){ finish({error:'not-allowed'}); return; }
    r.lang='en-US'; r.interimResults=false; r.maxAlternatives=5;
    r.onresult=e=>{ got=[...e.results[0]].map(a=>a.transcript); };
    r.onerror=e=>{ err=e.error; };
    r.onend=()=>{ finish(got?{alts:got}:{error:err||'no-speech'}); };
    try{ r.start(); }catch(e){ finish({error:'not-allowed'}); return; }
    /* 인식이 끝나지 않고 멈춘 경우를 대비한 안전장치 */
    timer=setTimeout(()=>{ finish({error:'timeout'}); try{ r.abort(); }catch(e){} },12000);
  });
}
const STOP=new Set(['a','an','the','to','i']);
const norm=s=>s.toLowerCase().replace(/wanna/g,'want to').replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
const close=(a,b)=>a===b||(b.length>=4&&lev(a,b)<=1)||(b.length>=7&&lev(a,b)<=2);
function judge(it,alts){
  if(it.free){
    return alts.some(a=>{const s=norm(a).join(' ');return /\bwant\b/.test(s)&&Object.keys(JOBS).some(j=>s.includes(j))||(/\bwant\b/.test(s)&&norm(a).some(w=>Object.keys(JOBS).some(j=>j.length>=4&&!j.includes(' ')&&close(w,j))));});
  }
  const keys=norm(it.text).filter(w=>!STOP.has(w)); const must=it.must||[];
  return alts.some(a=>{
    const ws=norm(a);
    const hasMust=must.every(m=>ws.some(w=>close(w,m)));
    const hit=keys.filter(k=>ws.some(w=>close(w,k))).length;
    return hasMust&&hit/keys.length>=0.75;
  });
}

const KEY='nobody-escape-v4';
function load(){ try{ const r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.stars) return r; }catch(e){} return {stars:{},done:[],letters:{},intro:false}; }
let S=load();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
const solved=(si,mi)=>S.stars[si+'-'+mi]!=null;
const allSolved=si=>STAGES[si].missions.every((_,k)=>solved(si,k));
const pieceReady=si=>{ const need=STAGES[si].pieceNeeds||STAGES[si].missions.map((_,k)=>k); return need.every(k=>solved(si,k))&&!S.letters[si]; };
function checkDone(si){ if(allSolved(si)&&S.letters[si]&&!S.done.includes(si)) S.done.push(si); }

TYPES.match=function(area,d,api){
  const n=d.pairs.length;
  const L=shuffle(d.pairs.map((p,i)=>({i,face:p.left}))),R=shuffle(d.pairs.map((p,i)=>({i,text:p.right,ko:p.ko})));
  let a=null,b=null,matched=0;
  const colL=el('div',{class:'col'}),colR=el('div',{class:'col'});
  const fb=el('div',{class:'fb'});
  function pick(side,o,btn){
    const col=side==='L'?colL:colR;
    col.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
    btn.classList.add('sel');
    if(side==='L') a={o,btn}; else { b={o,btn}; say(o.text); }
    if(a&&b){
      if(a.o.i===b.o.i){
        a.btn.classList.remove('sel');b.btn.classList.remove('sel');
        a.btn.classList.add('ok');b.btn.classList.add('ok');
        fb.className='fb good'; fb.textContent=`✅ ${b.o.text} = ${b.o.ko}`;
        matched++; a=b=null;
        if(matched===n) setTimeout(()=>api.complete(),900);
      } else {
        const x=a.btn,y=b.btn; shakeEl(x);shakeEl(y);
        fb.className='fb bad'; fb.textContent='짝이 맞지 않아요. 다시 골라 보세요.';
        api.wrong(true);
        setTimeout(()=>{x.classList.remove('sel');y.classList.remove('sel');},350);
        a=b=null;
      }
    }
  }
  L.forEach(o=>{const btn=el('button',{class:d.leftText?'card word':'card pic','aria-label':'그림 카드'},o.face);btn.onclick=()=>pick('L',o,btn);colL.append(btn);});
  R.forEach(o=>{const btn=el('button',{class:'card word'},o.text);btn.onclick=()=>pick('R',o,btn);colR.append(btn);});

};

TYPES.memory=function(area,d,api){
  const cards=shuffle(d.pairs.flatMap((p,i)=>[{k:i,t:'pic',v:p.pic},{k:i,t:'word',v:p.word}]));
  let open=[],lock=false,found=0,tries=0;
  const grid=el('div',{class:'mem'});
  const fb=el('div',{class:'fb'},'시도 0번');
  cards.forEach(c=>{
    const b=el('button',{class:'mcard back','aria-label':'뒤집지 않은 카드'},'❔');
    b.onclick=()=>{
      if(lock||open.includes(b)||b.classList.contains('found')) return;
      b.className='mcard '+(c.t==='pic'?'pic':'');
      b.textContent=c.v;
      if(c.t==='word') say(c.v);
      open.push(b); b._c=c;
      if(open.length===2){
        tries++; fb.textContent=`시도 ${tries}번`; lock=true;
        const [x,y]=open;
        if(x._c.k===y._c.k){
          setTimeout(()=>{ x.classList.add('found');y.classList.add('found');open=[];lock=false;found++;
            fb.className='fb good'; fb.textContent=`✅ 찾았어요! (${found}/${d.pairs.length})`;
            if(found===d.pairs.length) setTimeout(()=>api.complete(),700); },450);
        } else {
          setTimeout(()=>{ open.forEach(z=>{z.className='mcard back';z.textContent='❔';}); open=[];lock=false; },950);
        }
      }
    };
    grid.append(b);
  });
  area.append(grid,fb);
};

TYPES.order=function(area,d,api){
  let r=0;
  function round(){
    area.innerHTML='';
    const items=d.rounds[r];
    let pool=shuffle(items.map((t,i)=>({t,i})));
    let guard=0; while(pool.every((o,idx)=>o.i===idx)&&guard++<10) pool=shuffle(pool);
    let chosen=[],busy=false;
    const fb=el('div',{class:'fb'});
    const slots=el('div',{class:'stack'}),pieces=el('div',{class:'stack',style:'margin-top:16px'});
    function draw(){
      slots.innerHTML='';pieces.innerHTML='';
      items.forEach((_,k)=>{
        const o=chosen[k];
        const s=el('button',{class:'line slotline'+(o?' filled':''),disabled:!o||busy,onclick:()=>{ if(busy) return; chosen.splice(k,1); draw(); }},el('span',{class:'n'},k+1),o?o.t:'');
        slots.append(s);
      });
      pool.forEach(o=>{
        const used=chosen.includes(o);
        pieces.append(el('button',{class:'line piece',disabled:used||busy,onclick:()=>{ chosen.push(o); say(o.t); draw(); if(chosen.length===items.length) check(); }},o.t));
      });
    }
    async function check(){
      busy=true; draw();
      if(chosen.every((o,k)=>o.i===k)){
        fb.className='fb good'; fb.textContent='✅ 편지가 완성됐어요! 읽어 볼게요.';
        await sayAll(items);
        r++; if(r<d.rounds.length) round(); else api.complete();
      } else {
        fb.className='fb bad'; fb.textContent='순서가 맞지 않아요. 다시 해 볼까요?';
        api.wrong(true); shakeEl(slots);
        await wait(900); chosen=[]; busy=false; fb.textContent=''; draw();
      }
    }
    area.append(el('div',{class:'qhead'},`편지 ${r+1} / ${d.rounds.length}`),slots,el('div',{class:'tiny',style:'margin-top:14px'},'아래 조각을 순서대로 눌러요. 위의 칸을 누르면 되돌릴 수 있어요.'),pieces,fb);
    draw();
  }
  round();
};

TYPES.spell=function(area,d,api){
  let wi=0;
  function show(){
    area.innerHTML='';
    const w=d.words[wi],target=w.word.replace(/ /g,'').toUpperCase();
    let tiles=w.tiles||shuffle(target.split('').map(ch=>({ch})));
    if(!w.tiles){ let g=0; while(tiles.map(t=>t.ch).join('')===target&&g++<10) tiles=shuffle(tiles); }
    let picked=[],busy=false;
    const answer=el('div',{class:'answer'}),tileBox=el('div',{class:'tiles'}),fb=el('div',{class:'fb'});
    function draw(){
      answer.innerHTML='';tileBox.innerHTML='';
      for(let k=0;k<target.length;k++) answer.append(el('div',{class:'ans'},picked[k]?picked[k].ch:''));
      tiles.forEach(t=>{
        tileBox.append(el('button',{class:'tile',disabled:picked.includes(t)||busy,onclick:()=>{ picked.push(t); draw(); if(picked.length===target.length) check(); }},t.ch,t.from?el('small',{},t.from):null));
      });
    }
    async function check(){
      busy=true; draw();
      if(picked.map(t=>t.ch).join('')===target){
        fb.className='fb good'; fb.textContent=`✅ ${w.word}!`;
        await say(w.word); await wait(500);
        wi++; if(wi<d.words.length) show(); else api.complete();
      } else {
        fb.className='fb bad'; fb.textContent='철자가 달라요. 다시 해 봐요.';
        api.wrong(true); shakeEl(answer); await wait(800); picked=[]; busy=false; fb.textContent=''; draw();
      }
    }
    area.append(
      el('div',{class:'qhead'},`자물쇠 ${wi+1} / ${d.words.length}`),
      el('div',{class:'picword'},w.pic,el('span',{class:'ko'},w.ko)),
      w.lead?el('p',{class:'qtext en',style:'text-align:center'},w.lead):null,
      answer,tileBox,

        el('button',{class:'btn ghost small',onclick:()=>say(w.word)},'🔊 듣기')),
      fb);
    draw();
  }
  show();
};

TYPES.speak=function(area,d,api){
  let i=0;
  function show(){
    area.innerHTML='';
    const it=d.sentences[i];
    let attempts=0,fails=0,busy=false,done=false;
    const bubble=el('div',{class:'bubble'},el('div',{class:'bk'},it.ko||''),el('div',{class:'big'},it.text));
    const fb=el('div',{class:'fb'}),
      mic=el('button',{class:'btn micbtn'},'🎤 말하기'),
      pass=el('button',{class:'btn teal small',hidden:true},'👩‍🏫 선생님 확인으로 통과'),
      help=el('button',{class:'linkbtn',onclick:()=>offerPass()},'마이크가 안 되나요?');
    const sample=it.sample||it.text;
    function offerPass(){ pass.hidden=false; help.hidden=true; }
    if(!SR){ fb.className='fb bad'; fb.textContent='이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열면 마이크를 쓸 수 있어요. 지금은 소리 내어 읽고 선생님 확인으로 넘어가요.'; offerPass(); }
    async function success(viaTeacher){
      if(done) return; done=true;
      bubble.classList.add('ok');
      fb.className='fb good'; fb.textContent=viaTeacher?'✅ 선생님 확인 완료!':'✅ 완벽해요! 그림자가 따라 웃어요.';
      mic.disabled=true; pass.hidden=true;
      if(viaTeacher) api.wrong(true);
      await say(sample); await wait(500);
      i++; if(i<d.sentences.length) show(); else api.complete();
    }
    pass.onclick=()=>success(true);
    mic.onclick=async()=>{
      if(busy||done) return;
      if(!SR){ offerPass(); return; }
      busy=true; stopSpeech();
      mic.classList.add('live'); mic.textContent='🎙️ 듣는 중… 말해 보세요!'; fb.className='fb'; fb.textContent='';
      const r=await listen();
      busy=false; mic.classList.remove('live'); mic.textContent='🎤 말하기';
      if(r.error){
        fails++; fb.className='fb bad';
        if(/no-speech|aborted/.test(r.error)){
          fb.textContent='소리가 잘 안 들렸어요. 마이크 버튼을 누르고 또박또박 말해 보세요.';
          if(fails>=2){ fb.textContent+=' 계속 안 되면 아래 “선생님 확인으로 통과”를 눌러요.'; offerPass(); }
        } else {
          fb.textContent=r.error==='timeout'?'마이크 소리가 들어오지 않아요. 선생님 확인으로 넘어갈 수 있어요.':'마이크를 사용할 수 없어요. 이 화면에서는 마이크가 막혀 있을 수 있어요. 선생님 확인으로 넘어가요.';
          offerPass();
        }
        return;
      }
      if(judge(it,r.alts)) success(false);
      else {
        attempts++; fails++; api.wrong(true); shakeEl(bubble);
        fb.className='fb bad';
        fb.textContent=`들린 말: “${r.alts[0]}” `+(attempts===1?'— 괜찮아요! 천천히 또박또박 다시 말해 봐요.':attempts===2?'— 🐢 천천히 들려줄게요. 잘 듣고 따라 해 보세요.':'— 거의 다 왔어요! 한 번 더 도전하거나 선생님 확인으로 넘어갈 수 있어요.');
        if(attempts===2) say(sample,0.6);
        if(fails>=2) offerPass();
      }
    };
    area.append(
      el('div',{class:'qhead'},`문장 ${i+1} / ${d.sentences.length}`),
      el('div',{class:'mirror'},el('div',{class:'shadowman','aria-hidden':'true'},'🕴️'),bubble),
      el('div',{class:'row',style:'margin-top:16px'},
        el('button',{class:'btn ghost small',onclick:()=>say(sample)},'🔊 먼저 듣기'),
        el('button',{class:'btn ghost small',onclick:()=>say(sample,0.6)},'🐢 천천히'),
        mic,pass),
      fb,
      el('p',{class:'tiny'},'처음 마이크를 누르면 “마이크 사용 허용” 창이 떠요. 허용을 눌러 주세요.'),
      help);
    if(pass.hidden===false) help.hidden=true;
  }
  show();
};

  function findPath(tx,ty){

  function setObjs(){
    def=ROOMDEF[si];
    objs=def.objs.map((o,i)=>{ const q=Object.assign({id:i},o); q.wall=(q.y+q.h<=WALL+2); q.cx=q.x+q.w/2;
      q.stand=q.stand||(q.wall?[q.cx,FY0+2]:[q.cx,Math.min(FY1,(q.sl?q.sl[1]+q.sl[3]:q.y+q.h)+9)]);

  }
  const labelText=o=>{

    if(o.type==='door'){ const op=S.done.includes(si); return (op?'🚪 ':'🔒 ')+(op?(allDone()?'출구 문':'다른 방으로'):'문'); }

  };
  const labelCls=o=>{ let k='wlabel '+o.type; if(o.type==='mission'){ if(solved(si,o.mi)) k+=' done'; else if(o.needsPiece&&dialLocked(si)) k+=' lock'; } if(o.type==='door') k+=S.done.includes(si)?' done':' lock'; if(o.wall) k+=' below'; return k; };

      const b=el('button',{class:labelCls(o),onclick:e=>{ e.stopPropagation(); goTo(o); }},labelText(o));

    });
  }
  function refresh(){

    const need=pieceReady(si);
    if(need&&!pieceObj){ const p=def.piece; pieceObj={type:'piece',kind:'piece',inter:true,x:p[0]-10,y:p[1]-22,w:20,h:24,cx:p[0],wall:false,stand:[p[0],p[1]+4],zone:{x:p[0]-20,y:p[1]-30,w:40,h:44}}; }
    if(!need) pieceObj=null;

    hooks.onChange&&hooks.onChange();
  }
  function interact(o){
    if(!o||paused) return; targetObj=null; P.path=[];
    if(o.type==='decoy'){ toast(o.msg,2600); }

      if(o.needsPiece&&dialLocked(si)){
        if(!S.letters[si]) toast('먼저 금고 퀴즈 패널을 풀고 이 방의 꿈 조각을 얻어야 해요.',2800);
        else toast(`다이얼을 돌리려면 다른 방의 꿈 조각 ${missingLetters(si).length}개가 더 필요해요. (${missingLetters(si).map(k=>k+1).join(', ')}번 방)`,3200);
        return; }

    else if(o.type==='door'){ if(S.done.includes(si)) nextRoom(si); else { const left=STAGES[si].missions.filter((_,k)=>!solved(si,k)).length; toast(left?`문이 잠겨 있어요. 남은 단서 ${left}개를 풀어 보세요!`:'문이 잠겨 있어요. 방 어딘가에서 반짝이는 꿈 조각을 찾아요!',2800); } }

  function goTo(o){ if(paused) return; marker={x:o.stand[0],y:o.stand[1],t:0}; if(inZone(o)){ P.path=[]; targetObj=null; interact(o); return; } targetObj=o; P.path=findPath(o.stand[0],o.stand[1]); if(!P.path.length){ targetObj=null; interact(o); } }
  function goPoint(x,y){ targetObj=null; const ty=Math.max(FY0,y); marker={x,y:ty,t:0}; P.path=findPath(Math.min(FX1,Math.max(FX0,x)),Math.min(FY1,ty)); }
  function hitObj(x,y){
    const all=(pieceObj?[pieceObj]:[]).concat(objs.filter(o=>o.inter).sort((a,b)=>(b.y+b.h)-(a.y+a.h)));
    return all.find(o=>x>=o.x-2&&x<=o.x+o.w+2&&y>=o.y-2&&y<=o.y+o.h+2)||null;
  }
  function step(dt){
    let vx=0,vy=0;
    const kx=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0),ky=(keys.ArrowDown||keys.s||keys.S?1:0)-(keys.ArrowUp||keys.w||keys.W?1:0);

    if(P.moving){ const nx=P.x+vx*sp*dt,ny=P.y+vy*sp*dt; if(walk(nx,P.y)) P.x=nx; if(walk(P.x,ny)) P.y=ny;
      if(Math.abs(vx)>Math.abs(vy)) P.dir=vx>0?'right':'left'; else P.dir=vy>0?'down':'up'; }
    let nb=null,nd=1e9; objs.concat(pieceObj?[pieceObj]:[]).forEach(o=>{ if(!o.inter||!inZone(o)) return; let d=Math.hypot(P.x-o.cx,P.y-(o.y+o.h/2)); if(o.type==='piece') d-=40; else if(o.type==='door') d-=10; else if(o.type==='mission') d-=5; if(d<nd){ nd=d; nb=o; } });
    if(nb!==near){ near=nb; const lab={door:'🚪 문 열기',mission:'🔍 조사하기',piece:'✨ 줍기',decoy:'👀 살펴보기'}; actBtn.hidden=!near; if(near) actBtn.textContent=lab[near.type]; labelsEl.querySelectorAll('.wlabel').forEach(b=>b.classList.toggle('near',!!near&&b._o===near)); }
  }
  function draw(){
    c.imageSmoothingEnabled=false; c.drawImage(bg,0,0);
    const back=objs.filter(o=>o.wall),front=objs.filter(o=>!o.wall);
    const stateOf=o=>({solved:o.type==='mission'&&solved(si,o.mi),locked:!!o.needsPiece&&dialLocked(si),open:S.done.includes(si)});
    back.forEach(o=>{ const f=DRAW[o.kind]; if(f) f(c,o,stateOf(o),t); });
    const list=front.map(o=>({y:o.sl?o.sl[1]+o.sl[3]:o.y+o.h,f:()=>{ const f=DRAW[o.kind]; if(f) f(c,o,stateOf(o),t); }}));
    if(pieceObj) list.push({y:def.piece[1],f:()=>drawPiece(c,def.piece[0],def.piece[1],t)});
    list.push({y:P.y,f:()=>drawPlayer(c,P,t)});
    list.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
    objs.filter(o=>o.type==='mission'&&!solved(si,o.mi)&&!(o.needsPiece&&dialLocked(si))).forEach(o=>{ if(Math.floor(t*2+o.id)%2) EM(c,'✨',o.x+o.w-3,o.y+2,9); });
    if(near){ c.strokeStyle='rgba(246,185,59,'+(0.6+0.4*Math.sin(t*8))+')'; c.lineWidth=1; c.strokeRect(near.x-1.5,near.y-1.5,near.w+3,near.h+3); }
    if(marker){ marker.t+=0.03; if(marker.t>0.7) marker=null; else { c.strokeStyle='rgba(255,255,255,'+(0.8-marker.t)+')'; c.lineWidth=1; c.beginPath(); c.ellipse(marker.x,marker.y,3+marker.t*16,1.5+marker.t*8,0,0,7); c.stroke(); } }
  }
  function frame(ts){

  }
  function moveJoy(e){
    const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2; let dx=e.clientX-cx,dy=e.clientY-cy; const Rr=(r.width/2)*0.75,d=Math.hypot(dx,dy);
    if(d>Rr){ dx*=Rr/d; dy*=Rr/d; } joy.x=dx/Rr; joy.y=dy/Rr; knobEl.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }

  function start(roomIndex,mount,h){

    cv=el('canvas',{width:GW,height:GH,'aria-label':'방 지도'}); labelsEl=el('div',{class:'wlabels'}); bannerEl=el('div',{class:'wbanner'},'물건을 바로 눌러 보세요 · 조이스틱으로 걸을 수도 있어요');

})();
